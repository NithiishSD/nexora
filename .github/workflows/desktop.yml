# Desktop client: lint/typecheck/tests and the installer for each OS.
# Linux builds the DEB, Windows builds the MSI (jpackage can only build installers for the OS it runs on).
name: Desktop

on:
  pull_request:
    paths:
      - 'nexora-desktop/**'
      - '.github/workflows/desktop.yml'
  push:
    branches: [main]
    paths:
      - 'nexora-desktop/**'
      - '.github/workflows/desktop.yml'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            installer: deb
          - os: windows-latest
            installer: msi
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: nexora-desktop   # the desktop client is its own Gradle build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Caches the Gradle distribution and dependencies between runs
      - uses: gradle/actions/setup-gradle@v4

      # Compose UI tests get a virtual display on Linux (they also run headless, the display is a safety net).
      - name: Install virtual display
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Build backend standalone engine (Linux)
        if: runner.os == 'Linux'
        run: |
          (cd ../Nexora-backend && ./gradlew bootJar)
          mkdir -p extra-resources/common
          cp ../Nexora-backend/build/libs/app.jar extra-resources/common/backend-engine.jar

      - name: Check and package (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum ./gradlew check packageDistributionForCurrentOS

      - name: Build backend standalone engine (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Push-Location ../Nexora-backend
          ./gradlew.bat bootJar
          Pop-Location
          New-Item -ItemType Directory -Force -Path extra-resources/common
          Copy-Item ../Nexora-backend/build/libs/app.jar extra-resources/common/backend-engine.jar

      - name: Check and package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./gradlew.bat check packageDistributionForCurrentOS createDistributable
          New-Item -ItemType Directory -Force -Path build/compose/binaries/main/portable
          Compress-Archive -Path build/compose/binaries/main/app/* -DestinationPath build/compose/binaries/main/portable/SmartSilk-Windows-Portable.zip

      - name: Upload Linux package (.deb)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: smartsilk-linux-deb
          path: nexora-desktop/build/compose/binaries/main/deb/*.deb
          if-no-files-found: error

      - name: Upload SmartSilk Server Engine package
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: smartsilk-server-engine
          path: smartsilk-server/**
          if-no-files-found: error

      - name: Upload Windows MSI installer (.msi)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: smartsilk-windows-installer
          path: nexora-desktop/build/compose/binaries/main/msi/*.msi
          if-no-files-found: error

      - name: Upload Windows Portable zip (.zip)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: smartsilk-windows-portable
          path: nexora-desktop/build/compose/binaries/main/portable/*.zip
          if-no-files-found: error


      # Keep the test report when something fails, so it can be downloaded
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: desktop-test-report-${{ matrix.os }}
          path: nexora-desktop/build/reports/tests/test


