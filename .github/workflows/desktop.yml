# Desktop client: lint/typecheck/tests and the installer for each OS.
# Linux builds the DEB, Windows builds the MSI (jpackage can only build installers for the OS it runs on).
name: Desktop

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'nexora-desktop/**'
      - '.github/workflows/desktop.yml'
  push:
    branches: [main]
    paths:
      - 'nexora-desktop/**'
      - '.github/workflows/desktop.yml'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            installer: deb
          - os: windows-latest
            installer: msi
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: nexora-desktop   # the desktop client is its own Gradle build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Caches the Gradle distribution and dependencies between runs
      - uses: gradle/actions/setup-gradle@v4

      # Compose UI tests get a virtual display on Linux (they also run headless, the display is a safety net).
      - name: Install virtual display
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Check and package (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum ./gradlew check packageDistributionForCurrentOS

      - name: Check and package (Windows)
        if: runner.os == 'Windows'
        run: ./gradlew.bat check packageDistributionForCurrentOS

      - uses: actions/upload-artifact@v4
        with:
          name: smartsilk-${{ matrix.installer }}
          path: nexora-desktop/build/compose/binaries/main/${{ matrix.installer }}/*
          if-no-files-found: error

      # Keep the test report when something fails, so it can be downloaded
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: desktop-test-report-${{ matrix.os }}
          path: nexora-desktop/build/reports/tests/test
