login.forgotPasswordTitle=கடவுச்சொல் மீட்பு மற்றும் அணுகல்
login.forgotPasswordContent=உங்கள் கடவுச்சொல் மறந்துவிட்டால்:\n\n• ஊழியர்கள் / ஆபரேட்டர்கள்: உங்கள் வணிக உரிமையாளரைத் தொடர்பு கொள்ளவும். அமைப்புகள் > பயனர் நிர்வாகத்தில் அவர்கள் உங்கள் கடவுச்சொல்லை மாற்றலாம்.\n\n• லோக்கல் என்ஜின் உரிமையாளர்: இந்த கணினியில் லோக்கலாக இயங்கினால், Local-Engine கோப்புறையில் clean-database கருவியைப் பயன்படுத்தி மீண்டும் தொடங்கலாம்.\n\n• பாதுகாப்பு குறிப்பு: லெட்ஜர் பாதுகாப்பின்படி, நிர்வாகி சரிபார்ப்பு இன்றி பொது இணைப்புகள் மூலம் கடவுச்சொல்லை மீட்டெடுக்க முடியாது.
login.alreadyRegisteredTitle=வணிகக் கணக்கு ஏற்கனவே அமைக்கப்பட்டுள்ளது
login.alreadyRegisteredContent=இந்த சர்வரில் ஏற்கனவே உரிமையாளர் கணக்கு உள்ளது.\n\n• நீங்கள் ஊழியர் எனில், உரிமையாளரிடம் புதிய பயனர் கணக்கு உருவாக்கக் கேட்கவும்.\n\n• புதிய வணிகத்தைத் தொடங்க விரும்பினால், சர்வர் அமைப்புகளை மாற்றவும் அல்லது புதிய லோக்கல் என்ஜினைத் தொடங்கவும்.

# Getting Started Guide & Tutorial
guide.title=ஸ்மார்ட்சில்க் தொடக்க வழிகாட்டி
guide.subtitle=உங்கள் வணிக லெட்ஜரை அமைக்க பின்வரும் படிகளைப் பின்பற்றவும்:
guide.step1Title=1. வணிக சுயவிவரத்தை அமைக்கவும்
guide.step1Desc=இன்வாய்ஸ்கள் மற்றும் அறிக்கைகளுக்காக உங்கள் நிறுவனத்தின் பெயர், முகவரி, GSTIN மற்றும் தொலைபேசி எண்ணை அமைக்கவும்.
guide.step1Action=அமைப்புகளுக்குச் செல்
guide.step2Title=2. சப்ளையர்கள் & வாடிக்கையாளர்களைச் சேர்க்கவும்
guide.step2Desc=பட்டு நூல் சப்ளையர்கள், பாவு வாங்குபவர்கள், தறி நெசவாளர்கள் மற்றும் ஜாப்-ஒர்க்கர்களைப் பதிவு செய்யவும்.
guide.step2Action=பார்ட்டிகளைச் சேர்
guide.step3Title=3. தொடக்க இருப்பு அல்லது கொள்முதலைப் பதிவு செய்க
guide.step3Desc=கிடங்கு ஆரம்ப இருப்பு அல்லது சப்ளையரிடமிருந்து வாங்கிய பட்டு நூலைப் பதிவு செய்யவும்.
guide.step3Action=கொள்முதல் பதிவு
guide.step4Title=4. ஆர்டர்கள் & உற்பத்தியைத் தொடங்கவும்
guide.step4Desc=வாடிக்கையாளர் சேலை ஆர்டர்களைப் பதிவு செய்து, பாவு ஓட்டுதல், முறுக்குதல் மற்றும் சாயமிடுதல் வேலைகளைத் தொடங்கவும்.
guide.step4Action=ஆர்டர் உருவாக்கு
guide.step5Title=5. நிதி, கொடுப்பனவுகள் மற்றும் கூலிகளை நிர்வகிக்கவும்
guide.step5Desc=வங்கி/ரொக்க நிலவரம், சப்ளையர் பாக்கிகள், நெசவாளர் கூலி மற்றும் வாடிக்கையாளர் வரவுகளைக் கண்காணிக்கவும்.
guide.step5Action=நிதி லெட்ஜர்
