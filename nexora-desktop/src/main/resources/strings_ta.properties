# ---- Error messages by API code ----
error.VALIDATION_FAILED=ஹைலைட் செய்யப்பட்ட புலங்களைச் சரிசெய்யவும்.
error.MALFORMED_REQUEST=பயன்பாடு அனுப்பிய விவரங்களை சேவையகத்தால் படிக்க முடியவில்லை.
error.METHOD_NOT_ALLOWED=இந்தச் செயல்பாடு சேவையகத்தில் ஆதரிக்கப்படவில்லை.
error.UNSUPPORTED_MEDIA_TYPE=கோப்பு வடிவம் ஆதரிக்கப்படவில்லை.
error.UNAUTHENTICATED=தயவுசெய்து மீண்டும் உள்நுழையவும்.
error.TOKEN_EXPIRED=அமர்வு முடிந்தது. மீண்டும் உள்நுழையவும்.
error.INVALID_CREDENTIALS=தவறான பயனர் பெயர் அல்லது கடவுச்சொல்.
error.RATE_LIMITED=அதிக முயற்சிகள். சில நிமிடங்கள் கழித்து மீண்டும் முயற்சிக்கவும்.
error.ACCESS_DENIED=உங்கள் கணக்கிற்கு இந்த அனுமதி இல்லை.
error.RESOURCE_NOT_FOUND=இந்த பதிவு கிடைக்கவில்லை அல்லது நீக்கப்பட்டுள்ளது.
error.DUPLICATE_BUSINESS_NUMBER=இதே எண் அல்லது பெயரில் ஏற்கனவே பதிவு உள்ளது.
error.DUPLICATE_RESOURCE=இதே பதிவு ஏற்கனவே உள்ளது.
error.DUPLICATE_REQUEST=இந்த பதிவு ஏற்கனவே வெவ்வேறு மதிப்புகளுடன் சேமிக்கப்பட்டது.
error.CONCURRENT_MODIFICATION=வேறு ஒருவர் இந்த பதிவை மாற்றிவிட்டார். சமீபத்திய பதிவைக் காண புதுப்பிக்கவும்.
error.INVALID_STATE_TRANSITION=தற்போதைய நிலையில் இந்தச் செயல்பாடு சாத்தியமில்லை.
error.ORDER_LOCKED=இந்த ஆர்டர் உற்பத்தியில் உள்ளதால் மாற்ற முடியாது.
error.INSUFFICIENT_INVENTORY=தேவையான அளவு இருப்பு இல்லை.
error.INSUFFICIENT_FUNDS=இந்த கணக்கில் போதுமான பணம் இல்லை.
error.PURCHASE_RECEIPT_EXCEEDED=கொள்முதல் எடையை விட கூடுதல் எடையை ஏற்க முடியாது.
error.OUTSOURCE_RECEIPT_EXCEEDED=உற்பத்தியாளரிடம் உள்ள பட்டு எடையை விட அதிகமாக பெற முடியாது.
error.PAYMENT_ALLOCATION_EXCEEDED=நிலுவை தொகையை விட அதிக தொகை செலுத்த முடியாது.
error.INVALID_PAYMENT_ALLOCATION=தேர்ந்தெடுக்கப்பட்ட உருப்படி இந்த நபருக்குரியது அல்ல அல்லது ஏற்கனவே தீர்க்கப்பட்டது.
error.PRODUCTION_NOT_RECONCILED=வெளியீடு, சேதாரம் மற்றும் வேறுபாடு ஆகியவை உள்ளீட்டு எடையுடன் பொருந்த வேண்டும்.
error.INVALID_PARTY_ROLE=இந்த நபருக்கு தேவையான பங்குப் பதவி இல்லை.
error.PARTY_INACTIVE=இந்த நபர் செயலிழக்கப்பட்டுள்ளார். முதலில் இயக்கவும்.
error.INVALID_PRODUCT_FOR_OPERATION=இந்த தயாரிப்பை இங்கு பயன்படுத்த முடியாது.
error.INVALID_PAYMENT_METHOD=கட்டண முறை கணக்குடன் பொருந்தவில்லை.
error.INTERNAL_ERROR=சேவையகத்தில் பிழை ஏற்பட்டுள்ளது. உங்கள் தரவு மாறவில்லை.
error.NETWORK=சேவையகத்தை இணைக்க முடியவில்லை. இணைய இணைப்பைச் சரிபார்க்கவும்.
error.UNEXPECTED_RESPONSE=சேவையகம் புரிந்து கொள்ள முடியாத பதிலை அனுப்பியுள்ளது.
error.unknown=ஏதோ தவறு நடந்துவிட்டது ({0}). தயவுசெய்து மீண்டும் முயற்சிக்கவும்.

